<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WATCHTOWER</title>
  <meta name="description" content="WATCHTOWER, application de blocage intelligent des appels, sans publicite, sans suivi et sans collecte de donnees personnelles.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07070c;
      --panel: #12121b;
      --panel-soft: #191925;
      --text: #f7f4ff;
      --muted: #c7c1d8;
      --accent: #f04de4;
      --line: rgba(240, 77, 228, 0.34);
      --max-width: 1040px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(240, 77, 228, 0.16), transparent 30rem),
        linear-gradient(180deg, #080810 0%, #0e0e16 52%, #07070c 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    .page {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      overflow: hidden;
      margin: 24px 0 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(18, 18, 27, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .visual-header {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .visual-header img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .hero-content {
      padding: clamp(24px, 4vw, 48px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 16px;
    }

    .intro {
      max-width: 760px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .links a {
      min-width: 190px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }

    .footer {
      padding: 10px 0 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    @media (max-width: 720px) {
      .page {
        padding: 14px;
      }

      .hero {
        margin-top: 14px;
        border-radius: 6px;
      }

      .links a {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="home-title">
      <figure class="visual-header">
        <img src="./assets/WATCHTOWER_Feature_Graphic_FR.png" alt="Banniere WATCHTOWER en francais presentant le blocage intelligent des appels, le fonctionnement hors ligne, l'absence de publicite et l'absence de collecte de donnees.">
      </figure>

      <div class="hero-content">
        <h1 id="home-title">WATCHTOWER</h1>
        <p class="intro">WATCHTOWER est une application de blocage intelligent des appels concue pour aider a garder le controle, sans publicite, sans suivi et sans collecte de donnees personnelles par l'application.</p>

        <nav class="links" aria-label="Politiques de confidentialite">
          <a href="./privacy/">Politique de confidentialite</a>
          <a href="./privacy/en/">Privacy Policy</a>
        </nav>
      </div>
    </section>

    <footer class="footer">
      <p>WATCHTOWER — © 3D.MONTI – 2026</p>
    </footer>
  </main>
</body>
</html>
